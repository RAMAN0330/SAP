name: golive-academy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-golive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-golive_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-golive}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-golive}:${POSTGRES_PASSWORD:-golive_dev_pw}@postgres:5432/${POSTGRES_DB:-golive}
      REDIS_URL: redis://redis:6379
      PORT: 8787
      NODE_ENV: production
      # Email OTP (Gmail: SMTP_USER = the Gmail address, SMTP_PASS = a Google app password). Empty = OTP off.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # SAP news auto-blog: hours between runs (0 = off), posts per run, oldest item age in days.
      NEWS_INTERVAL_HOURS: ${NEWS_INTERVAL_HOURS:-6}
      NEWS_MAX_PER_RUN: ${NEWS_MAX_PER_RUN:-5}
      NEWS_MAX_AGE_DAYS: ${NEWS_MAX_AGE_DAYS:-7}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "${API_PORT:-8787}:8787"
    profiles: ["full"]

  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT:-8088}:80"
    profiles: ["full"]

volumes:
  pgdata:
  redisdata:
