server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Compress text responses (JS/CSS/JSON/SVG). Without this the 370 KB app bundle goes out uncompressed.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  location /api/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build files never change, so browsers keep them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Icons, manifest, images in public/: cache for a week.
  location ~* \.(?:png|jpe?g|webp|svg|ico|woff2?|webmanifest)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # index.html must always be revalidated, or a stale copy points at chunks a new deploy removed.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
